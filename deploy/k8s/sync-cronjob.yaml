# One-shot Redis → PostgreSQL synchronisation.
# Apply with: kubectl apply -f deploy/k8s/sync-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: voting-sync
  labels:
    app: voting-service
    component: sync
spec:
  # Kubernetes CronJob resolution is 1 minute. Live results still come from Redis;
  # this job only persists aggregates to PostgreSQL.
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 50
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: voting-service
            component: sync
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: voting-service:latest
              imagePullPolicy: IfNotPresent
              command: ["./voting-sync"]
              envFrom:
                - secretRef:
                    name: voting-service-secrets
                - configMapRef:
                    name: voting-service-config
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
